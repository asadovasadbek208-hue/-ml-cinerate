server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass https://ml-cinerate-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Host ml-cinerate-production.up.railway.app;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
